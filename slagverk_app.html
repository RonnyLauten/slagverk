  const catRows=CATS.map(cat=>{
    const cur=lvls[cat]||1;
    const pills=[1,2,3,4,5].map(l=>`<button class="lvl-btn${cur==l?' on':''}" onclick="setStudentLevel('${cat}',${l},this)">${l}</button>`).join('');
    return `<div style="margin-bottom:12px"><label>${CAT_LABELS[cat]}</label><div class="level-row" style="margin-top:6px">${pills}</div></div>`;
  }).join('');
  settingsEditAktiv=st?.aktiv!==false;
  const dagOpts=['','mandag','tirsdag','onsdag','torsdag','fredag','lørdag','søndag']
    .map(d=>`<option value="${d}" ${(st?.defaultDag||'')===(d)?'selected':''}>${d||'— ingen standard —'}</option>`).join('');
  document.getElementById('modal-student-body').innerHTML=`
    <div class="form-group" style="margin-bottom:12px"><label>Navn</label><input id="st-navn" type="text" value="${esc(st?.navn||'')}" placeholder="Elevens navn"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:14px">
      <div>
        <div style="font-weight:500">Aktiv elev</div>
        <div style="font-size:12px;color:var(--text2)">Inaktive elever vises ikke i Øving</div>
      </div>
      <button id="st-aktiv-btn" onclick="toggleAktivBtn()" type="button"
        style="position:relative;width:44px;height:26px;cursor:pointer;flex-shrink:0;border:none;padding:0;background:${settingsEditAktiv?'var(--green)':'var(--surface3)'};border-radius:13px;transition:background 0.2s">
        <span id="st-aktiv-thumb" style="position:absolute;top:3px;left:${settingsEditAktiv?'21px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.2s"></span>
      </button>
    </div>

    <div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Standard øvingstidspunkt</div>
      <div style="display:flex;gap:10px">
        <div class="form-group"><label>Dag</label><select id="st-dag">${dagOpts}</select></div>
        <div class="form-group"><label>Tid</label><input id="st-tid" type="text" placeholder="16:55-17:20" value="${esc(st?.defaultTid||'')}"></div>
      </div>
    </div>

    <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Nivå per kategori</div>
    ${catRows}
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" onclick="saveStudent()">Lagre</button>
      ${id?`<button class="btn btn-danger btn-sm" onclick="deleteStudent('${jsq(id)}')">Slett</button>`:''}
    </div>
  `;
  document.getElementById('modal-student').classList.add('open');
  setTimeout(()=>document.getElementById('st-navn').focus(),100);
}
function closeStudentModal(){ document.getElementById('modal-student').classList.remove('open'); renderSettings(); }
function toggleAktivBtn(){
  settingsEditAktiv=!settingsEditAktiv;
  const btn=document.getElementById('st-aktiv-btn');
  const thumb=document.getElementById('st-aktiv-thumb');
  if(btn) btn.style.background=settingsEditAktiv?'var(--green)':'var(--surface3)';
  if(thumb) thumb.style.left=settingsEditAktiv?'21px':'3px';
}
function setStudentLevel(cat,lvl,btn){
  btn.closest('.level-row').querySelectorAll('.lvl-btn').forEach((b,i)=>b.classList.toggle('on',i+1===lvl));
  btn.dataset.cat=cat; btn.dataset.lvl=lvl;
}
function saveStudent(){
  const navn=document.getElementById('st-navn').value.trim();
  if(!navn){ toast('Skriv inn navn'); return; }
  const modal=document.getElementById('modal-student-body');
  const nivå={};
  CATS.forEach(cat=>{
    const onBtn=modal.querySelector(`.level-row .lvl-btn.on:is([data-cat="${cat}"])`);
    // fallback: find by position
    const row=modal.querySelectorAll('.level-row');
    const catIdx=CATS.indexOf(cat);
    if(row[catIdx]){ const on=row[catIdx].querySelector('.lvl-btn.on'); nivå[cat]=on?parseInt(on.textContent):1; }
    else nivå[cat]=1;
  });
  const aktiv=settingsEditAktiv;
  const defaultDag=document.getElementById('st-dag')?.value||'';
  const defaultTid=document.getElementById('st-tid')?.value.trim()||'';
  if(settingsEditStudentId){
    const st=getStudent(settingsEditStudentId);

// Normalize Norwegian sheet names for matching (ø→o, æ→ae, å→a)
function normName(n){ return n.toLowerCase().replace(/ø/g,'o').replace(/æ/g,'ae').replace(/å/g,'a').trim(); }
function findSheet(wb, patterns){
  return wb.SheetNames.find(n => patterns.some(p => p.test(normName(n))));
}

function importExcel(input){
  const file=input.files[0];
  if(!file) return;
  toast('Leser fil…');
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const allSheets=wb.SheetNames;
      console.log('Ark i filen:', allSheets);
      let imported={students:0,exercises:0,sessions:0};

      // --- ELEVER / HJELPER SHEET ---
      const hjSheet=findSheet(wb,[/hjelper/,/^elev/,/student/]);
      if(hjSheet){
        // Try as object first (with headers), fall back to raw array
        const objRows=XLSX.utils.sheet_to_json(wb.Sheets[hjSheet]);
        const arrRows=XLSX.utils.sheet_to_json(wb.Sheets[hjSheet],{header:1});
        let navnListe=[];
        if(objRows.length){
          // Find the column that looks like student names
          const keys=Object.keys(objRows[0]||{});
          const nameKey=keys.find(k=>/elev|navn|name|student/i.test(k))||keys[0];
          navnListe=objRows.map(r=>String(r[nameKey]||'').trim()).filter(Boolean);
        } else {
          navnListe=arrRows.map(r=>String(r[0]||'').trim()).filter(Boolean);
        }
        navnListe.forEach(navn=>{
          const skip=['elev','navn','name','student','#'];
          if(skip.some(s=>navn.toLowerCase()===s)) return;
          if(!students.find(s=>s.navn===navn)){
            students.push({id:uid(),navn,nivå:{TEK:1,SD:1,Timp:1,Melodisk:1,Kit:1}});
            imported.students++;
          }
        });
        saveStudents();
      }

      // --- ØVELSER / BØKER SHEET ---
      // Note: normName converts "Bøker" → "boker" so /bok/ matches correctly
      const bokSheet=findSheet(wb,[/bok/,/ovelse/,/exercise/,/book/]);
      if(bokSheet){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[bokSheet]);
        if(rows.length) console.log('Bøker kolonner:', Object.keys(rows[0]));
        const catMap={
          'SD':'SD','Skarptromme':'SD','Snare':'SD','Snaredrum':'SD',
          'Tuned':'Melodisk','Melodisk':'Melodisk','Marimba':'Melodisk','Xylophone':'Melodisk',
          'Timp':'Timp','Timpani':'Timp',
          'Kit':'Kit','Trommesett':'Kit','Drumset':'Kit',
          'TEK':'TEK','Teknikk':'TEK','Tech':'TEK'
        };
        rows.forEach(row=>{
          // Accept any non-empty exercise name
          const øvelse=String(
            row.Exercise||row.Øvelse||row.exercise||row.øvelse||
            row.Name||row.name||row.Navn||row.navn||''
          ).trim();
          if(!øvelse) return;
          const rawCat=String(row.Category||row.Kategori||row.category||row.kategori||'').trim();
          const kategori=catMap[rawCat]||'SD';
          const exId=String(row.Short||row.ID||row.id||row.short||'').trim()||uid();
          // Avoid duplicates on re-import
          if(exercises.find(ex=>ex.id===exId)) return;
          exercises.push({
            id: exId,
            bok:     String(row.Book||row.Bok||row.book||row.bok||'').trim(),
            bokKort: String(row['Book short']||row['Book Short']||row.BokKort||row.Short||row.short||'').trim(),
            forfatter: String(row.Author||row.Forfatter||row.author||'').trim(),
            kategori,
            øvelse,
            side:  parseInt(row.Page||row.Side||row.page||row.side||0)||0,
            nivå:  parseInt(row.Level||row.Nivå||row.level||row.nivå||1)||1,
            fokus: String(row['Øvelsens fokus']||row.Fokus||row.fokus||row.Focus||row.focus||'').trim()
          });
          imported.exercises++;
        });
        saveExercises();
      }

      // --- HISTORIKK / DATA SHEET ---
      const dataSheet=findSheet(wb,[/^data$/,/historikk/,/^okt/,/session/,/logg/]);
      if(dataSheet){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[dataSheet]);
        if(rows.length) console.log('Data kolonner:', Object.keys(rows[0]));
        rows.forEach(row=>{
          const elevNavn=String(row.Elev||row.elev||row.Student||row.student||'').trim();
          const elev=students.find(s=>s.navn===elevNavn);
          if(!elev) return;
          const datoRaw=row.Dato||row.dato||row.Date||row.date||'';
          let dato='';
          if(datoRaw){
            try{
              // Handle Excel serial date numbers
              if(typeof datoRaw==='number'){
                const d=XLSX.SSF.parse_date_code(datoRaw);
                dato=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
              } else {
                const d=new Date(datoRaw);
                if(!isNaN(d)) dato=localDateStr(d);
              }
            }catch{}
          }
          const kategorier={};
          CATS.forEach(cat=>{
            // Try both short key (TEK) and long label (Teknikk)
            const planText=String(row[cat]||row[CAT_LABELS[cat]]||'').trim();
            const planlagt=planText?[{type:'text',text:planText}]:[];
            const lekse=[];
            for(let i=1;i<=3;i++){
              const hw=String(row[cat+i]||row[CAT_LABELS[cat]+i]||'').trim();
              if(hw) lekse.push({type:'text',text:hw});
            }
            kategorier[cat]={planlagt,gjennomgått:[],lekse};
          });
          sessions.push({id:uid(),elevId:elev.id,dato,tid:String(row.Tid||row.tid||'').trim(),kategorier});
          imported.sessions++;
        });
        saveSessions();
      }

      // Build result message
      const parts=[];
      if(hjSheet)   parts.push(`${imported.students} elever (ark: "${hjSheet}")`);
      else          parts.push(`⚠ Ingen elevark funnet`);
      if(bokSheet)  parts.push(`${imported.exercises} øvelser (ark: "${bokSheet}")`);
      else          parts.push(`⚠ Ingen øvelsesark funnet`);
      if(dataSheet) parts.push(`${imported.sessions} økter (ark: "${dataSheet}")`);
      else          parts.push(`⚠ Ingen dataark funnet`);

      const noneFound=!hjSheet&&!bokSheet&&!dataSheet;
      if(noneFound){
        alert(`Fant ingen kjente ark.\n\nArk i filen: ${allSheets.join(', ')}\n\nForventet: "Hjelper", "Bøker", "Data"\n\nSi fra hvilke navn som brukes!`);
      } else {
        alert('Import ferdig:\n\n'+parts.join('\n'));
        renderSettings();
        if(!practiceState) practiceState=newPracticeState();
        else if(!practiceState.studentId&&students.length) practiceState.studentId=students[0].id;
      }
      input.value='';
    } catch(err){
      console.error(err);
      alert('Feil ved import:\n'+err.message);
      input.value='';
    }
  };
  reader.readAsArrayBuffer(file);
}

// 4a — Export entire book database as semicolon-separated CSV (BOM for Excel UTF-8)
function exportBooksCSV(){
  if(!exercises.length){ toast('Ingen øvelser å eksportere'); return; }
  const cols=['id','bok','bokKort','forfatter','kategori','øvelse','side','nivå','fokus'];
  const csvVal=v=>{ const s=String(v??'').replace(/"/g,'""'); return /[;\n"]/g.test(s)?`"${s}"`:s; };
  const rows=[cols.join(';'),...exercises.map(ex=>cols.map(c=>csvVal(ex[c])).join(';'))];
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'slagverk_bøker.csv'});
  a.click(); URL.revokeObjectURL(a.href);
  toast(`${exercises.length} øvelser eksportert`);
}

// 4b — Import book database from JSON (replaces all exercises after validation + confirmation)
// Parse semicolon-separated CSV, handling quoted fields and BOM
function parseBookCSV(text){
  text=text.replace(/^\uFEFF/,''); // strip Excel BOM
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  function parseLine(line){
    const fields=[]; let i=0;
    while(i<=line.length){
      if(line[i]==='"'){
        let v=''; i++;
        while(i<line.length){ if(line[i]==='"'&&line[i+1]==='"'){v+='"';i+=2;} else if(line[i]==='"'){i++;break;} else v+=line[i++]; }
        fields.push(v);
        if(line[i]===';') i++;
      } else {
        const end=line.indexOf(';',i);
        if(end===-1){fields.push(line.slice(i));break;}
        fields.push(line.slice(i,end)); i=end+1;
      }
    }
    return fields;
  }
  const headers=parseLine(lines[0]);
  return lines.slice(1).map(l=>{ const v=parseLine(l); const o={}; headers.forEach((h,i)=>o[h]=v[i]??''); return o; });
}

// 4b — Import book database from CSV (same format as export)
function importBooksCSV(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const list=parseBookCSV(e.target.result);
      if(!list.length){ toast('Ingen øvelser funnet i filen'); input.value=''; return; }
      const required=['id','bok','bokKort','forfatter','kategori','øvelse','side','nivå','fokus'];
      const missing=required.filter(f=>!(f in list[0]));
      if(missing.length){ toast('Mangler kolonner: '+missing.join(', ')); input.value=''; return; }
      if(!confirm(`Dette vil erstatte alle ${exercises.length} øvelser i databasen med ${list.length} øvelser fra filen. Fortsett?`)){ input.value=''; return; }
      exercises=list;
      saveExercises();
      toast(`${list.length} øvelser importert`);
      renderBooks();
    } catch(err){ toast('Feil: '+err.message); }
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

const STUDENT_COLORS=['#FF6B35','#30D158','#0A84FF','#FFD60A','#BF5AF2','#FF453A','#32ADE6','#FF9F0A','#AC8E68','#6AC4DC','#30B0C7','#A2845E','#FF6961','#77DD77','#AEC6CF'];

let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();

function studentColor(id){
  const idx=students.findIndex(s=>s.id===id);
  return STUDENT_COLORS[Math.max(0,idx)%STUDENT_COLORS.length];
}

function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calGoToday(){ calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); renderCalendar(); }

function renderCalendar(){
  const el=document.getElementById('screen-calendar');
  const today=todayStr();

  // Index sessions by date
  const byDate={};
  sessions.forEach(s=>{
    if(!s.dato) return;
    (byDate[s.dato]||(byDate[s.dato]=[])).push(s);
  });

  // Calendar arithmetic
  const firstDay=new Date(calYear,calMonth,1);
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const monthLabel=firstDay.toLocaleDateString('no-NO',{month:'long',year:'numeric'});

  // Monday-first day-of-week offset
  let startDow=firstDay.getDay(); // 0=Sun
  startDow=startDow===0?6:startDow-1; // Mon=0

  // Day header row (Mon–Sun)
  const DAY_NAMES=['Ma','Ti','On','To','Fr','Lø','Sø'];
  const dhHtml=DAY_NAMES.map(d=>`<div class="cal-dh">${d}</div>`).join('');

  // Build cells
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell cal-empty"></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const daySess=byDate[dateStr]||[];
    const isToday=dateStr===today;
    const dow=(startDow+d-1)%7; // 5=Sat,6=Sun
    const isWeekend=dow>=5;
    const nameEntries=daySess.slice(0,5).map(s=>{
      const color=studentColor(s.elevId);
      const st=getStudent(s.elevId);
      const firstName=(st?.navn||'?').split(' ')[0].slice(0,6);
      return `<div class="cal-cell-name"><div class="cal-cell-name-dot" style="background:${color}"></div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(firstName)}</span></div>`;
    }).join('');
    const moreCount=daySess.length>5?`<div style="font-size:8px;color:var(--text3)">+${daySess.length-5}</div>`:'';
    cells+=`<div class="cal-cell${isToday?' cal-today':''}${isWeekend?' cal-weekend':''}${daySess.length?' cal-has-sess':''}" ${daySess.length?`onclick="openCalDay('${dateStr}')"`:''}>
      <div class="cal-day-num">${d}</div>
      ${nameEntries?`<div class="cal-cell-names">${nameEntries}${moreCount}</div>`:''}
    </div>`;
  }

  // Pad end
  const totalCells=startDow+daysInMonth;
  const remainder=totalCells%7;
  if(remainder>0){ for(let i=remainder;i<7;i++) cells+=`<div class="cal-cell cal-empty"></div>`; }

  // Session count for this month
  const monthPfx=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthSessCount=sessions.filter(s=>s.dato&&s.dato.startsWith(monthPfx)).length;

  // Legend
  const legendHtml=students.map((s,i)=>{
    const monthCount=sessions.filter(x=>x.elevId===s.id && x.dato && x.dato.startsWith(monthPfx)).length;
    return `<div class="cal-legend-item" onclick="openStudentSessions('${jsq(s.id)}')" title="Vis ${esc(s.navn)}s økter denne måneden">
      <div class="cal-legend-dot" style="background:${STUDENT_COLORS[i%STUDENT_COLORS.length]}"></div>
      <span>${esc(s.navn)}</span>
      <span class="cal-legend-count">${monthCount}</span>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="s-head"><div class="s-title">Kalender</div>
      <button class="btn btn-ghost btn-sm" onclick="calGoToday()">I dag</button>
    </div>
    <div class="cal-nav">
      <button class="btn btn-secondary btn-icon" style="font-size:18px" onclick="calPrev()">‹</button>
      <div class="cal-month-title">${esc(monthLabel)}</div>
      <button class="btn btn-secondary btn-icon" style="font-size:18px" onclick="calNext()">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dh-row">${dhHtml}</div>
      <div class="cal-cells">${cells}</div>
    </div>
    ${monthSessCount?`<div style="font-size:12px;color:var(--text3);font-family:var(--mono);margin-bottom:10px">${monthSessCount} økt${monthSessCount!==1?'er':''} denne måneden</div>`:''}
    ${students.length?`<div class="cal-legend">${legendHtml}</div>`:''}
    ${!sessions.length?`<div class="empty" style="padding:24px 0"><div class="empty-icon">📅</div><div>Ingen økter ennå</div><div class="empty-msg">Lagre en økt eller importer Excel</div></div>`:''}
  `;
}

function calSessHtml(sess, color, nameOrDate){
  const catChips=CATS.map(cat=>{
    const k=sess.kategorier?.[cat];
    const planCount=(k?.planlagt||[]).length;
    const hwCount=(k?.lekse||[]).length;
    if(!planCount&&!hwCount) return '';
    return `<div class="cal-sess-cat"><b>${CAT_LABELS[cat]}</b> ${planCount}${hwCount?` ★${hwCount}`:''}</div>`;
  }).filter(Boolean).join('');
  return `<div class="cal-day-session">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="cal-sess-student">
        <div class="cal-sess-color" style="background:${color}"></div>
        <span>${esc(nameOrDate)}</span>
        ${sess.tid?`<span class="cal-sess-time">${esc(sess.tid)}</span>`:''}
      </div>
      <button class="cal-go-btn" onclick="openPracticeForSession('${jsq(sess.elevId)}','${jsq(sess.dato)}')" title="Åpne i Øving">✏️ Øving</button>
    </div>
    ${catChips?`<div class="cal-sess-cats">${catChips}</div>`:'<div style="font-size:13px;color:var(--text3)">Ingen øvelser registrert</div>'}
  </div>`;
}

function openCalDay(dateStr){
  const daySess=sessions.filter(s=>s.dato===dateStr).sort((a,b)=>(a.tid||'').localeCompare(b.tid||''));
  if(!daySess.length) return;
  document.getElementById('modal-cal-day-title').textContent=fmtDate(dateStr);
  const bodyHtml=daySess.map(sess=>{
    const st=getStudent(sess.elevId);
    return calSessHtml(sess, studentColor(sess.elevId), st?.navn||'Ukjent');
  }).join('');
  document.getElementById('modal-cal-day-body').innerHTML=bodyHtml||'<div class="empty">Ingen økter</div>';
  document.getElementById('modal-cal-day').classList.add('open');
}
function closeCalDay(){ document.getElementById('modal-cal-day').classList.remove('open'); }

function openStudentSessions(studentId){
  const st=getStudent(studentId);
  const monthPfx=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthLabel=new Date(calYear,calMonth,1).toLocaleDateString('no-NO',{month:'long',year:'numeric'});
  const stSess=sessions
    .filter(s=>s.elevId===studentId && s.dato && s.dato.startsWith(monthPfx))
    .sort((a,b)=>a.dato.localeCompare(b.dato));
  const color=studentColor(studentId);
  document.getElementById('modal-cal-day-title').innerHTML=
    `<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span>${esc(st?.navn||'Ukjent')}</span><span style="font-size:13px;font-weight:400;color:var(--text2);margin-left:6px">${esc(monthLabel)}</span>`;
  const bodyHtml=stSess.length
    ? stSess.map(sess=>calSessHtml(sess, color, fmtDate(sess.dato))).join('')
    : `<div style="color:var(--text3);padding:16px 0;font-size:14px;text-align:center">Ingen økter denne måneden</div>`;
  document.getElementById('modal-cal-day-body').innerHTML=bodyHtml;
  document.getElementById('modal-cal-day').classList.add('open');
}

// =====================================================================
// INIT
// =====================================================================
document.addEventListener('DOMContentLoaded',async()=>{
  // Older versions stored the timestamp JSON-encoded
  const sa=lsStr(K.savedAt); if(sa&&sa.startsWith('"')){ try{ lsSet(K.savedAt,JSON.parse(sa)); }catch{} }
  // Existing OneDrive users from before this version count as "OneDrive used on this device"
  if(graphAccount()) lsSet(K.wasIn,'1');
  loadAll();
  practiceState=newPracticeState();
  renderPractice();
  updateSyncUI();
  await tryAutoConnect();                       // PC datafil (skipped when OneDrive login is used here)
  const loggedInNow=await handleOAuthCallback(); // returning from Microsoft login
  if(!loggedInNow && graphAccount()) await graphCheck('start'); // always compare with OneDrive before any upload
  updateSyncUI();
  if(currentTab==='settings') renderSettings();
});
</script>
